# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF Race Condition (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask app that writes user input into a shell script, validates it, then deletes it, leaving a window to run it (race condition). The SKF lab folder python/RaceCondition is
# vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-race-condition

networks:
  lab: { cidr: 10.60.155.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 5000, name: web, http: true, publish: 5050 }]
    resources: { cpus: 1, memory_mb: 256 }
    docker:
      build: app

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 120
  - name: the page runs hello.sh and shows its greeting
    script: checks/hello.sh

message: |
  OWASP SKF Race Condition answers at http://localhost:{{ machines.web.services.0.publish }}/.
  The form writes your name into a script that the next request runs. When is it checked?
